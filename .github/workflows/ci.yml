name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check required documentation sections
        run: python scripts/check_readme.py

  django:
    name: Lint, migrations, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Django project
        id: detect
        run: |
          if [ -f manage.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::manage.py not present yet; Django checks skipped until the project is scaffolded."
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff coverage

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: ruff check .

      - name: Migration check
        if: steps.detect.outputs.present == 'true'
        env:
          DJANGO_SETTINGS_MODULE: sparein.settings
          SECRET_KEY: ci-only-not-a-real-secret
          DEBUG: 'False'
        run: python manage.py makemigrations --check --dry-run

      - name: Unit tests with coverage
        if: steps.detect.outputs.present == 'true'
        env:
          DJANGO_SETTINGS_MODULE: sparein.settings
          SECRET_KEY: ci-only-not-a-real-secret
          DEBUG: 'False'
        run: |
          coverage run --source='.' manage.py test
          coverage report -m
          coverage xml

      - name: Coverage summary
        if: steps.detect.outputs.present == 'true'
        run: |
          {
            echo '### Coverage'
            echo ''
            echo '```'
            coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
