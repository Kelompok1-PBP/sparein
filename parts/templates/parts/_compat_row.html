{% load static %}{# Satu baris perangkat di form. Parameter: row, number (kosong di <template>, diisi form.js) #}
<div class="part-row">
  <div class="part-row__head">
    <h3 class="part-row__title">Perangkat <span data-row-number>{{ number }}</span></h3>
    <label class="icon-button icon-button--danger" title="Hapus baris ini">{{ row.DELETE }}<img src="{% static 'core/icons/trash-danger.svg' %}" alt="" width="20" height="20"><span class="sr-only">Hapus baris ini</span></label>
  </div>
  <div class="part-row__fields">
    {% include "parts/_field.html" with field=row.device %}
    {% include "parts/_field.html" with field=row.note %}
  </div>
</div>
