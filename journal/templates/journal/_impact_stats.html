<div class="stats" data-stats="{{ scope }}">
  <article class="card stat">
    <p class="stat__label">Perbaikan berhasil</p>
    <p class="stat__value" data-stat="repairs">{{ stats.repairs }}</p>
  </article>
  <article class="card stat">
    <p class="stat__label">Limbah elektronik terhindar</p>
    <p class="stat__value"><span data-stat="waste">{{ stats.waste_avoided_kg|floatformat:"2g" }}</span> kg</p>
  </article>
  <article class="card stat">
    <p class="stat__label">Biaya terhemat</p>
    <p class="stat__value">Rp<span data-stat="cost">{{ stats.cost_avoided|floatformat:"0g" }}</span></p>
  </article>
</div>
