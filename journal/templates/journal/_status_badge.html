{% load static %}<span class="badge-status badge-status--{{ status }}" data-badge><img src="{% if status == 'planned' %}{% static 'journal/icons/calendar-muted.svg' %}{% elif status == 'in_progress' %}{% static 'journal/icons/wrench-blue.svg' %}{% elif status == 'succeeded' %}{% static 'core/icons/circle-check-success.svg' %}{% else %}{% static 'journal/icons/circle-x-danger.svg' %}{% endif %}" alt="" width="16" height="16">{{ label }}</span>
