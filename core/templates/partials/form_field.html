{# Satu isian form. Parameter: field, label, kind (text atau password), autocomplete, hint (opsional) #}
<div class="field">
  <label class="field__label" for="{{ field.id_for_label }}">{{ label }}<span class="field__req" aria-hidden="true">*</span></label>
  <div class="field__control">
    <input class="input{% if kind == 'password' %} input--password{% endif %}"
           type="{{ kind }}"
           name="{{ field.html_name }}"
           id="{{ field.id_for_label }}"
           {% if kind != 'password' and field.value %}value="{{ field.value }}"{% endif %}
           autocomplete="{{ autocomplete }}"
           {% if kind != 'password' %}autocapitalize="none" spellcheck="false"{% endif %}
           aria-required="true"
           {% if field.errors %}aria-invalid="true"{% endif %}
           {% if field.errors or hint %}aria-describedby="{{ field.id_for_label }}-msg"{% endif %}>
    {% if kind == 'password' %}
      <button type="button" class="field__toggle" data-toggle-password hidden aria-label="Tampilkan password" aria-pressed="false">
        <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
      </button>
    {% endif %}
  </div>
  {% if field.errors %}
    <div class="field__msg field__msg--error" id="{{ field.id_for_label }}-msg">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
      <div>{% for error in field.errors %}<span>{{ error }}</span>{% endfor %}</div>
    </div>
  {% elif hint %}
    <p class="field__msg" id="{{ field.id_for_label }}-msg">{{ hint }}</p>
  {% endif %}
</div>
